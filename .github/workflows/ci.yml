name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: deanery
          POSTGRES_USER: deanery
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U deanery -d deanery"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: deanery
      POSTGRES_USER: deanery
      POSTGRES_PASSWORD: ci-ephemeral-only
      POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES: '1'
      DJANGO_SETTINGS_MODULE: config.settings.test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: pytest
      - run: python manage.py spectacular --file ../contracts/openapi.generated.yaml --validate --fail-on-warn
      - run: pip freeze > ../contracts/python-resolved.txt
      - name: Export dependency review data
        run: |
          python - <<'PYCODE'
          import base64, json, pathlib, zlib
          data = {str(p): p.read_text() for p in pathlib.Path('../contracts').glob('*') if p.is_file()}
          print('REVIEW_BUNDLE=' + base64.b64encode(zlib.compress(json.dumps(data).encode())).decode())
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: backend-contract-and-dependencies
          path: |
            contracts/openapi.generated.yaml
            contracts/python-resolved.txt
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: deanery
          POSTGRES_USER: deanery
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U deanery -d deanery"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: deanery
      POSTGRES_USER: deanery
      POSTGRES_PASSWORD: ci-ephemeral-only
      POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES: '1'
      DJANGO_SETTINGS_MODULE: config.settings.development

    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ../backend/requirements.txt
      - run: python ../backend/manage.py migrate --noinput
      - run: python ../backend/manage.py shell < ../backend/tests/seed_browser.py
      - run: npm install -D eslint@latest @eslint/js@latest eslint-plugin-react-hooks@latest typescript-eslint@latest vitest@latest @vitejs/plugin-react@latest vite@latest
      - run: npm audit --json || true
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Export dependency review data
        run: |
          python - <<'PYCODE'
          import base64, json, pathlib, zlib
          files = [pathlib.Path('package.json'), pathlib.Path('package-lock.json'), *pathlib.Path('dist').rglob('*')]
          data = {str(p): p.read_text() for p in files if p.is_file()}
          print('REVIEW_BUNDLE=' + base64.b64encode(zlib.compress(json.dumps(data).encode())).decode())
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build-and-lock
          path: |
            frontend/dist
            frontend/package-lock.json
            frontend/package.json
            frontend/test-results
